{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BulkMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/bulkmed.css' %}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">💊 BulkMed</div>
    <p class="auth-subtitle">B2B Bulk Medicine Procurement Platform</p>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password">
      </div>
      {% if form.errors %}
        <div class="alert alert-danger py-2 mb-3">Invalid username or password.</div>
      {% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100 btn-lg">Sign In</button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.82rem;">
      Don't have an account? <a href="{% url 'register' %}" style="color:var(--primary);font-weight:600;">Register here</a>
    </p>
    <p class="text-center text-muted mt-2 mb-0" style="font-size:0.78rem;">
      Test accounts: <code>store1</code> – <code>store10</code> / password: <code>test1234</code>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
